name: Milestone A CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  schedule:
    # A full independent regression sweep keeps a regular safety net without
    # making every already-verified merge wait for the same six shards again.
    - cron: "17 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: milestone-a-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  draft-provider-free-verification:
    name: draft-provider-free-verification
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
    steps:
      - name: Checkout exact Draft revision with merge-base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Draft revision identity
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          # setup-node's npm cache is keyed from this committed lockfile. It
          # caches downloaded packages only; every run still uses `npm ci`.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run cost-bounded Draft verification
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: node scripts/action-660k-run-draft-ci.mjs "$BASE_REVISION" "$EXPECTED_REVISION"
      - name: Verify tracked source remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  ready-docs-only-classification:
    name: ready-docs-only-classification
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout exact GitHub merge candidate with merge-base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact GitHub merge candidate identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$GITHUB_REF" = "$EXPECTED_REF"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Classify only exact plain-documentation changes
        id: classify
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_REVISION: ${{ github.sha }}
        run: node scripts/rel-00-ci-b7-docs-only-classifier.mjs --github-output "$GITHUB_OUTPUT" "$BASE_REVISION" "$CANDIDATE_REVISION"
      - name: Verify tracked source remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  provider-free-verification-shard:
    name: provider-free-verification / ${{ matrix.shard }}
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.ready-docs-only-classification.outputs.disposition != 'docs_only')) }}
    needs:
      - ready-docs-only-classification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - foundation
          - replay-lineage
          - snapshot-admission
          - snapshot-issuance
          - non-forgeable-authority
          - lossless-scalar
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
    steps:
      - name: Checkout exact candidate or main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For a non-merged pull_request GitHub sets github.sha/github.ref to
          # its immutable refs/pull/<number>/merge candidate. Scheduled and
          # manual runs verify the exact main revision selected by GitHub.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate or main revision identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          # setup-node's npm cache is keyed from this committed lockfile. It
          # caches downloaded packages only; every run still uses `npm ci`.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run provider-free verification shard
        run: node scripts/action-660j-run-provider-free-ci-shard.mjs "${{ matrix.shard }}"
      - name: Verify tracked source remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  provider-free-verification:
    name: provider-free-verification
    if: ${{ always() }}
    needs:
      - ready-docs-only-classification
      - provider-free-verification-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the applicable verification route to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          READY_DOCS_ONLY_RESULT: ${{ needs.ready-docs-only-classification.result }}
          READY_DOCS_ONLY_DISPOSITION: ${{ needs.ready-docs-only-classification.outputs.disposition }}
          SHARD_RESULT: ${{ needs.provider-free-verification-shard.result }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PULL_REQUEST_DRAFT" = "false" ] && [ "$READY_DOCS_ONLY_DISPOSITION" = "docs_only" ]; then
            test "$READY_DOCS_ONLY_RESULT" = "success"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # A protected Ready merge has already passed the exact immutable
            # merge-candidate matrix. Post-merge attestation below binds that
            # candidate to main; the independent full sweep runs nightly.
            test "$SHARD_RESULT" = "skipped"
            exit 0
          fi
          test "$SHARD_RESULT" = "success"

  # The candidate matrix is the merge gate. This records the immutable
  # candidate identity so a later main push can prove it received that exact
  # tested tree and workflow revision without paying for a duplicate matrix.
  merge-candidate-provenance:
    name: merge-candidate-provenance / POC
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.provider-free-verification.result == 'success' && needs.provider-free-verification-shard.result == 'success' }}
    needs:
      - provider-free-verification
      - provider-free-verification-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact GitHub merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact GitHub merge candidate identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$GITHUB_REF" = "$EXPECTED_REF"
      - name: Capture successful candidate provenance
        id: capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/action-660o-merge-candidate-provenance.mjs capture .ci-provenance/merge-candidate-provenance.json
      - name: Store candidate provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          path: .ci-provenance/merge-candidate-provenance.json
          if-no-files-found: error
          retention-days: 7

  # Keep a cheap post-merge attestation. Direct pushes, non-merge commits,
  # missing provenance or workflow/tree drift are reported as uncertain; they
  # never claim that the candidate matrix covered main.
  post-merge-candidate-provenance:
    name: post-merge-candidate-provenance / POC (attestation)
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - provider-free-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main revision identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Discover matching candidate provenance
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          workflow_output="$GITHUB_OUTPUT"
          for attempt in 1 2 3 4; do
            attempt_output="$RUNNER_TEMP/merge-candidate-discovery-${attempt}.output"
            GITHUB_OUTPUT="$attempt_output" node scripts/action-660o-merge-candidate-provenance.mjs discover .ci-provenance/merge-candidate-discovery.json
            status="$(node -p "JSON.parse(require('node:fs').readFileSync('.ci-provenance/merge-candidate-discovery.json', 'utf8')).status")"
            if [ "$status" != "uncertain_candidate_artifact_missing" ] || [ "$attempt" = "4" ]; then
              cat "$attempt_output" >> "$workflow_output"
              break
            fi
            sleep 15
          done
      - name: Download matching candidate provenance
        if: ${{ steps.discover.outputs.provenance_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.discover.outputs.provenance_artifact_name }}
          run-id: ${{ steps.discover.outputs.provenance_run_id }}
          github-token: ${{ github.token }}
          path: .ci-provenance/candidate
      - name: Attest exact main against candidate provenance
        if: ${{ steps.discover.outputs.provenance_run_id != '' && needs.provider-free-verification.result == 'success' }}
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/action-660o-merge-candidate-provenance.mjs verify .ci-provenance/candidate/merge-candidate-provenance.json .ci-provenance/merge-candidate-discovery.json .ci-provenance/post-merge-candidate-provenance.json
      - name: Store post-merge attestation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-candidate-provenance-main-${{ github.sha }}
          path: .ci-provenance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
