name: Milestone A CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: milestone-a-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  draft-provider-free-verification:
    name: draft-provider-free-verification
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
    steps:
      - name: Checkout exact Draft revision with merge-base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Draft revision identity
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          # setup-node's npm cache is keyed from this committed lockfile. It
          # caches downloaded packages only; every run still uses `npm ci`.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run cost-bounded Draft verification
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: node scripts/action-660k-run-draft-ci.mjs "$BASE_REVISION" "$EXPECTED_REVISION"
      - name: Verify tracked source remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  provider-free-verification-shard:
    name: provider-free-verification / ${{ matrix.shard }}
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - foundation
          - replay-lineage
          - snapshot-admission
          - snapshot-issuance
          - non-forgeable-authority
          - lossless-scalar
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact revision identity
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          # setup-node's npm cache is keyed from this committed lockfile. It
          # caches downloaded packages only; every run still uses `npm ci`.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run provider-free verification shard
        run: node scripts/action-660j-run-provider-free-ci-shard.mjs "${{ matrix.shard }}"
      - name: Verify tracked source remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  provider-free-verification:
    name: provider-free-verification
    if: ${{ always() }}
    needs:
      - provider-free-verification-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every provider-free shard to succeed
        env:
          SHARD_RESULT: ${{ needs.provider-free-verification-shard.result }}
        run: test "$SHARD_RESULT" = "success"
